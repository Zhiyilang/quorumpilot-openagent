name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the eval suite (offline, stdlib only)
        run: python eval.py
      - name: CLI smoke test
        run: |
          python -m quorumpilot review examples/proposal_risky.json
          python -m quorumpilot policy examples/proposal_clean.json
